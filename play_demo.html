<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofrenda Viva — Demo Video Walkthrough</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07050A;
      color: #F8F9FA;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      max-width: 1200px;
      width: 100%;
      background: rgba(20, 14, 28, 0.9);
      border: 1px solid rgba(255, 183, 3, 0.35);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 183, 3, 0.2);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 183, 3, 0.2);
      padding-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.5rem;
      color: #FFB703;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .badge {
      background: rgba(6, 214, 160, 0.2);
      color: #6EE7B7;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .video-wrapper {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      background: #000;
    }
    img.demo-video {
      width: 100%;
      height: auto;
      display: block;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #94A3B8;
    }
    .btn-download {
      background: linear-gradient(135deg, #FFB703, #FF9E1B);
      color: #000;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 999px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(255, 183, 3, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><span>🏵️</span> Ofrenda Viva — Video Demo Walkthrough</h1>
      <span class="badge">Día de los Muertos & Local Open AI</span>
    </header>

    <div class="video-wrapper">
      <video controls autoplay loop muted playsinline class="demo-video">
        <source src="ofrenda_viva_demo.mp4" type="video/mp4">
        Tu navegador no soporta el elemento de video.
      </video>
    </div>

    <div class="controls">
      <span>Demostración de alta fidelidad H.264 (29.7s, 1080p compatible, 10 FPS)</span>
      <div style="display: flex; gap: 10px;">
        <a href="ofrenda_viva_demo.mp4" download="ofrenda_viva_demo.mp4" class="btn-download">
          🎬 Descargar Video .MP4
        </a>
        <a href="ofrenda_viva_demo.webp" download="ofrenda_viva_demo.webp" class="btn-download" style="background: rgba(255,255,255,0.15); color: #fff; box-shadow: none;">
          🖼️ WebP
        </a>
      </div>
    </div>
  </div>
</body>
</html>
